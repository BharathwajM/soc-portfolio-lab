name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Backtest regression tests
        run: python -m unittest discover -s backtests -v

      - name: Python scripts compile
        run: python -m compileall -q backtests scripts

      - name: Sentinel rule and DCR definitions are valid JSON
        run: |
          for f in detections/*.json; do
            python -m json.tool "$f" > /dev/null && echo "valid: $f"
          done

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Output "::error file=$(Resolve-Path -Relative $f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed++
            }
          }
          if ($failed) { exit 1 }
          Write-Output "All scripts parse."
